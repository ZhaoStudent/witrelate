<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>反诈演练场 · 亲历一次被编排，学会识破它</title>
<style>
  /* ── 极简浅色：单列居中 · 一屏一焦点 · 其余全部收纳 ──────────────── */
  :root{
    --bg:#fbfbfc; --line:#e8eaee; --line2:#d7dade;
    --tx:#20242c; --tx2:#5c6470; --tx3:#9aa1ac;
    --accent:#4d6bfe; --accent-bg:#eef1ff;
    --pro:#c2571f;
    --ok:#1f7a4d;
    --warn:#b3413b; --warn-bg:#fbeeed;
    --trap:#8a6d1a; --trap-bg:#faf3dc;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .hide{display:none !important}

  /* ── 骨架：顶栏 + 滚动区 + 粘底输入 ─────────────────────────────── */
  .app{display:flex; flex-direction:column; height:100vh; max-width:640px; margin:0 auto; padding:0 20px}
  .top{
    flex:none; display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 2px 10px; font-size:12.5px; color:var(--tx3); min-height:44px;
  }
  .top .t{color:var(--tx2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .top .t.brand{color:var(--tx); font-size:13.5px}
  .top .r{flex:none; display:flex; gap:14px; align-items:center}
  .lnk{color:var(--tx3); text-decoration:none; cursor:pointer; white-space:nowrap}
  .lnk:hover{color:var(--accent)}
  .flow{flex:1; overflow-y:auto; display:flex; flex-direction:column}
  .col{width:100%; display:flex; flex-direction:column; padding:8px 2px 28px}

  /* ── 首屏空态 ────────────────────────────────────────────────────── */
  .empty{flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:10vh}
  .hi{font-size:20px; font-weight:600; letter-spacing:.3px; margin-bottom:20px}
  .bigbox{
    border:0.5px solid var(--line2); border-radius:16px; padding:14px 16px;
    display:flex; align-items:center; gap:12px; transition:border-color .15s; background:#fff;
  }
  .bigbox:focus-within{border-color:var(--accent)}
  .bigbox textarea{
    flex:1; border:none; outline:none; resize:none; font:inherit; font-size:14.5px;
    background:transparent; color:var(--tx); min-height:48px; max-height:200px; line-height:1.6;
  }
  .bigbox textarea::placeholder{color:var(--tx3)}
  .go{
    flex:none; width:34px; height:34px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:14px; cursor:pointer; display:grid; place-items:center;
  }
  .go:disabled{opacity:.45; cursor:not-allowed}
  .opts{display:flex; gap:16px; align-items:center; margin-top:14px; font-size:12.5px; color:var(--tx3); flex-wrap:wrap}
  .opts .d{cursor:pointer}
  .opts .d.on{color:var(--accent)}
  .opts .sep{color:var(--line2)}
  .footnote{font-size:11.5px; color:var(--tx3); text-align:center; padding:22px 0 14px}

  /* ── 加载 ────────────────────────────────────────────────────────── */
  .loading{display:none; align-items:center; gap:9px; color:var(--tx2); font-size:13px; padding:10px 2px}
  .loading.on{display:flex}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite}
  .dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  /* ── 对话流：指控方 = 小标 + 正文；用户 = 浅灰气泡 ───────────────── */
  .msgs{display:flex; flex-direction:column; gap:14px}
  .msg{display:flex; gap:10px}
  .msg.user{justify-content:flex-end}
  .who{flex:none; font-size:11px; color:var(--tx3); padding-top:4px; width:16px}
  .mbody{max-width:88%; min-width:0}
  .txt{white-space:pre-wrap; word-break:break-word; font-size:14.5px}
  .msg.user .txt{background:var(--accent-bg); border-radius:14px 14px 3px 14px; padding:9px 14px}
  .markrow{font-size:11.5px; margin-top:4px}
  button.mark{
    background:none; border:none; padding:0; font:inherit; font-size:11.5px;
    color:var(--tx3); cursor:pointer;
  }
  button.mark:hover:not(:disabled){color:var(--trap)}
  button.mark.on{color:var(--trap)}
  button.mark:disabled{cursor:default; opacity:.5}

  /* ── 受理官追问卡（极简） ────────────────────────────────────────── */
  .dcard{background:#f4f5f7; border-radius:14px; padding:12px 15px; max-width:88%}
  .dcard .qh{font-size:11.5px; color:var(--tx3); margin-bottom:3px}
  .dcard .qa{font-size:14px; margin-bottom:9px}
  .dcard textarea{
    width:100%; border:none; outline:none; resize:none; font:inherit; font-size:13.5px;
    background:var(--bg); border-radius:10px; padding:9px 12px; min-height:40px; color:var(--tx);
  }
  .drow{display:flex; gap:14px; align-items:center; margin-top:8px; font-size:12.5px}
  .drow .act{color:var(--accent); cursor:pointer; background:none; border:none; padding:0; font:inherit; font-size:12.5px}
  .drow .act.ghost{color:var(--tx3)}
  .drow .act:disabled{opacity:.45; cursor:default}
  .hint{font-size:11.5px; color:var(--tx3)}

  /* ── 粘底输入 ────────────────────────────────────────────────────── */
  #chat{display:flex; flex-direction:column; gap:14px}
  .composer{
    position:sticky; bottom:0; z-index:5; padding:10px 0 16px;
    background:linear-gradient(180deg, rgba(251,251,252,0), var(--bg) 30%);
  }
  .cinner{
    border:0.5px solid var(--line2); border-radius:16px; background:#fff;
    padding:11px 14px; display:flex; align-items:flex-end; gap:10px;
  }
  .cinner:focus-within{border-color:var(--accent)}
  .cinner textarea{
    flex:1; border:none; outline:none; resize:none; font:inherit; font-size:14px;
    background:transparent; color:var(--tx); min-height:22px; max-height:140px; line-height:1.6;
  }
  .cinner textarea::placeholder{color:var(--tx3)}
  .endlink{
    flex:none; background:none; border:none; padding:0; font:inherit; font-size:11.5px;
    color:var(--tx3); cursor:pointer; white-space:nowrap; padding-bottom:3px;
  }
  .endlink:hover:not(:disabled){color:var(--warn)}
  .endlink:disabled{opacity:.45; cursor:default}
  .sendbtn{
    flex:none; width:30px; height:30px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:13px; cursor:pointer; display:grid; place-items:center;
  }
  .sendbtn:disabled{opacity:.4; cursor:not-allowed}

  /* ── 复盘（排版式，去卡片边框） ──────────────────────────────────── */
  .reveal{padding:8px 2px 30px}
  .reveal h2{margin:0 0 4px; font-size:19px; font-weight:600}
  .meta{font-size:11.5px; color:var(--tx3); margin:18px 0 6px; letter-spacing:.4px}
  .traps{display:grid; gap:8px}
  .trap{background:var(--trap-bg); border-radius:11px; padding:10px 13px; font-size:13.5px}
  .trap .k{display:inline-block; background:#e2c96a; color:#3a2c00; border-radius:5px;
    padding:0 7px; font-size:11.5px; font-weight:600; margin-right:7px}
  .trap .ex{color:var(--trap); font-style:italic}
  .trap .why{color:var(--tx2); font-size:13px; margin-top:5px}
  ul.solid{margin:6px 0 0; padding-left:19px; color:var(--ok); font-size:14px}
  ul.solid li{margin:5px 0}
  ul.plain{margin:6px 0 0; padding-left:19px; color:var(--tx2); font-size:14px}
  ul.plain li{margin:5px 0}
  ul.marked{margin:6px 0 0; padding-left:19px; color:var(--trap); font-size:14px}
  ul.marked li{margin:5px 0}
  .banner{background:var(--warn-bg); border-radius:11px; color:var(--warn);
    padding:11px 14px; font-size:13.5px; margin-top:16px}
  .banner.top{margin:0 0 16px}
  .gapsec .bt{font-size:13px; font-weight:600; margin-top:10px}
  .gapsec ul{margin:2px 0 0; padding-left:19px; color:var(--tx2); font-size:13.5px}
  .gapsec .gnote{font-size:12.5px; color:var(--tx3); margin-top:4px; line-height:1.65}
  .endrow{display:flex; gap:14px; align-items:center; margin-top:26px}
  .textbtn{
    background:none; border:none; padding:0; font:inherit; font-size:13.5px;
    color:var(--tx); cursor:pointer; text-decoration:underline; text-underline-offset:4px;
  }
  .textbtn:hover{color:var(--accent)}

  /* ── 浮层（历史 / 口令 / 信息地图） ─────────────────────────────── */
  .veil{
    position:fixed; inset:0; background:rgba(30,34,42,.28); z-index:40;
    display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
  }
  .pop{
    width:min(420px, calc(100vw - 40px)); background:#fff; border-radius:16px;
    padding:20px 22px; box-shadow:0 12px 40px rgba(20,24,32,.18); max-height:64vh; overflow-y:auto;
  }
  .pop h3{margin:0 0 12px; font-size:15px; font-weight:600}
  .pop .close{float:right; color:var(--tx3); cursor:pointer; background:none; border:none; font-size:14px; padding:0 2px}
  .plist{display:flex; flex-direction:column; gap:2px}
  .pitem{
    font-size:13.5px; color:var(--tx2); padding:8px 10px; border-radius:9px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pitem:hover{background:var(--bg); color:var(--tx)}
  .pitem.on{color:var(--tx); font-weight:500}
  .pempty{font-size:12.5px; color:var(--tx3)}
  .pop input{
    width:100%; border:0.5px solid var(--line2); border-radius:10px; padding:10px 12px;
    font:inherit; font-size:13.5px; outline:none; color:var(--tx);
  }
  .pop input:focus{border-color:var(--accent)}
  .pop .note{font-size:11.5px; color:var(--tx3); margin-top:8px; line-height:1.6}
  .pop .meta{margin-top:0}
  .pop .prop{font-size:14.5px; font-weight:500; margin-bottom:4px}
  .gapline{display:flex; gap:10px; align-items:baseline; font-size:13px; margin-top:6px}
  .gapline .k{flex:none; width:78px; font-size:12px; font-weight:500}
  .gapline .k.s{color:var(--accent)} .gapline .k.t{color:var(--pro)} .gapline .k.m{color:var(--ok)}
  .gapline .v{color:var(--tx2); min-width:0}
  .jline{font-size:13px; color:var(--tx2); margin-top:10px}
  .jline b{color:var(--accent)}
  .chk{margin-top:6px; padding:7px 10px; border-radius:9px; font-size:12.5px;
    background:var(--trap-bg); color:var(--trap)}
  .chk.block{background:var(--warn-bg); color:var(--warn)}
  .onote{margin-top:4px; font-size:13px}

  @media (max-width:520px){ .app{padding:0 14px} }
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏：空态 = 品牌 + 历史/口令；对局态 = 命题 + 轮数/信息地图 -->
  <div class="top">
    <span class="t brand" id="headTitle">反诈演练场</span>
    <span class="r" id="topRight">
      <a class="lnk" id="histLink">历史</a>
      <a class="lnk" id="keyLink">口令</a>
    </span>
  </div>

  <div class="flow">
    <div class="col">

      <!-- 首屏空态 -->
      <section id="intro" class="empty">
        <div class="hi">今天想演练哪种被编排？</div>
        <div class="bigbox">
          <textarea id="event" rows="2" placeholder="有人在群里说我拿了回扣，还说他手里有转账记录……"></textarea>
          <button id="startBtn" class="go" title="开始体验">↗</button>
        </div>
        <div class="opts">
          <span class="d" data-diff="轻松">轻松·3轮</span>
          <span class="d on" data-diff="标准">标准·5轮</span>
          <span class="d" data-diff="困难">困难·7轮</span>
          <span class="sep">|</span>
          <span class="d" id="exLink">试个例子</span>
          <input type="hidden" id="difficulty" value="标准" />
        </div>
        <div class="footnote">教学模拟 · 指控方为虚构角色 · 难度只改轮数与话术密度</div>
      </section>

      <div id="loading" class="loading">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span id="loadingText">正在思考……</span>
      </div>

      <!-- 对局（命题/三桶/立题全收进「信息地图」浮层） -->
      <section id="chat" class="hide">
        <div id="msgs" class="msgs"></div>

        <!-- 受理官追问卡（可答可跳过——追问是可选的）。
             ⚠️ 显隐全部走 classList.toggle('hide', 条件)：add/remove 的显隐
                由静态判据按元素计数配对（tools/verify_experience），toggle
                不进计数。 -->
        <div id="detailsBox" class="dcard hide">
          <div class="qh">受理官 · 开辩前想确认一件事</div>
          <div class="qa" id="followupText"></div>
          <textarea id="details" rows="1" placeholder="补充你知道的情况（可留空）"></textarea>
          <div class="drow">
            <button id="detailsBtn" class="act">提交</button>
            <button id="skipBtn" class="act ghost">跳过，直接开辩</button>
          </div>
          <div class="hint" style="margin-top:6px">你补充的信息只进你和裁判的视野，指控方看不到。</div>
        </div>

        <!-- 粘底输入（挂在 #chat 内，与旧契约同构） -->
        <div id="composer" class="composer">
          <div class="cinner">
            <textarea id="reply" rows="1" placeholder="替自己辩白 · Enter 发送"></textarea>
            <button id="revealBtn" class="endlink">结束本局</button>
            <button id="sendBtn" class="sendbtn" title="发送">↗</button>
          </div>
        </div>
      </section>

      <!-- 复盘 -->
      <section id="revealBox" class="reveal hide"></section>

      <!-- 信息地图数据宿主（隐藏）：命题 / 三桶 / 立题（契约 id 在此） -->
      <div id="mapData" class="hide">
        <div id="proposition"></div>
        <div id="partitionBox"></div>
        <div id="openingBox"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── 浮层 ─────────────────────────────────────────────────────────── -->
<div id="histPop" class="veil hide">
  <div class="pop">
    <button class="close" data-close="histPop">✕</button>
    <h3>历史对局</h3>
    <div id="sideHist" class="plist"></div>
    <div class="note" style="margin-top:10px">服务重启后对局不保留，打不开的会自动下架。</div>
  </div>
</div>

<div id="keyPop" class="veil hide">
  <div class="pop">
    <button class="close" data-close="keyPop">✕</button>
    <h3>访问口令</h3>
    <input id="accessKey" type="password" placeholder="自建服务需要；本地无需填写" autocomplete="off" />
    <div class="note">口令只需填一次，浏览器会记住。不知道口令请找部署者。</div>
  </div>
</div>

<div id="mapPop" class="veil hide">
  <div class="pop">
    <button class="close" data-close="mapPop">✕</button>
    <h3>本局信息地图</h3>
    <div class="meta">要辩的指控</div>
    <div class="prop" id="mapProp">（未给出命题）</div>
    <div id="mapBuckets"></div>
    <div class="meta" style="margin-top:14px">立题</div>
    <div id="mapOpening"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let sid = null;
// 是否已达本局轮数上限（模块级：请求 finally 会恢复按钮，无条件恢复会把
// renderState() 刚设好的禁用覆盖掉——上限就只写在提示文字里了）。
let atCap = false;
// 当事人局中标记的「可疑」轮次号（Set：同轮点两次=取消，天然去重）。
const suspects = new Set();
// 是否已揭示（揭示后再标记没有意义——对照在服务端已经算完了）。
let revealed = false;

// ── localStorage 可用性守卫：node 验证桩里没有 localStorage ──────────
const HAS_LS = (typeof localStorage !== 'undefined');
function lsGet(k) { if (!HAS_LS) return null; try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { if (!HAS_LS) return; try { localStorage.setItem(k, v); } catch (e) {} }

// ── 访问口令（自建服务用；本地/无口令部署为空 = 不带这个头）──────────
function apiKey() {
  const el = $('accessKey');
  return ((el && el.value) || '').trim();
}
(function restoreKey() {
  const saved = lsGet('exp.key') || '';
  const el = $('accessKey');
  if (el && saved) el.value = saved;
})();
(function bindKey() {
  const el = $('accessKey');
  if (el && typeof el.addEventListener === 'function') {
    el.addEventListener('input', () => lsSet('exp.key', apiKey()));
  }
})();

// ── 浮层开关 ─────────────────────────────────────────────────────────
function openPop(id) { const el = $(id); if (el) el.classList.remove('hide'); }
function closePop(id) { const el = $(id); if (el) el.classList.add('hide'); }
(function bindPops() {
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.onclick = () => closePop(btn.dataset.close);
  });
  document.querySelectorAll('.veil').forEach(v => {
    v.onclick = (e) => { if (e.target === v) v.classList.add('hide'); };
  });
  if ($('histLink')) $('histLink').onclick = () => { renderHist(); openPop('histPop'); };
  if ($('keyLink')) $('keyLink').onclick = () => openPop('keyPop');
  if ($('mapLink')) $('mapLink').onclick = () => openPop('mapPop');
})();
if (typeof document.addEventListener === 'function') {
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.veil').forEach(v => v.classList.add('hide'));
  });
}

function setLoading(on, text) {
  $('loading').classList.toggle('on', on);
  if (text) $('loadingText').textContent = text;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ⚠️ HTTP 方法必须由**调用方显式声明**（旧页教训：靠"有没有 body"推断
//    方法曾把揭示静默发成 GET → 服务端 405，核心交付物整条走不到）。
async function api(path, {method = 'GET', body} = {}) {
  const headers = {'Content-Type': 'application/json'};
  if (apiKey()) headers['X-Access-Key'] = apiKey();
  const res = await fetch(path, {
    method,
    headers,
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    throw new Error('访问口令缺失或不正确——请点右上角「口令」填写后重试');
  }
  if (!res.ok) throw new Error(data.detail || ('请求失败 (' + res.status + ')'));
  return data;
}

// ── 历史对局（localStorage：sid + 标题；服务端重启即清空，404 时下架）──
function loadHist() {
  if (!HAS_LS) return [];
  try { return JSON.parse(lsGet('exp.sessions') || '[]'); } catch (e) { return []; }
}
function saveHist(list) { lsSet('exp.sessions', JSON.stringify(list.slice(0, 30))); }
function pushHist(newSid, title) {
  const list = loadHist().filter(x => x.sid !== newSid);
  list.unshift({sid: newSid, title: (title || '未命名对局').slice(0, 40), ts: Date.now()});
  saveHist(list);
}
function dropHist(deadSid) {
  saveHist(loadHist().filter(x => x.sid !== deadSid));
}
function renderHist() {
  const box = $('sideHist');
  if (!box) return;
  const list = loadHist();
  box.innerHTML = list.length
    ? list.map(x => '<div class="pitem' + (x.sid === sid ? ' on' : '') +
        '" data-sid="' + esc(x.sid) + '">' + esc(x.title) + '</div>').join('')
    : '<div class="pempty">还没有对局</div>';
}
(function bindHist() {
  const box = $('sideHist');
  if (!box) return;
  box.onclick = async (e) => {
    const item = e.target && e.target.closest ? e.target.closest('.pitem') : null;
    if (!item) return;
    const want = item.dataset.sid;
    setLoading(true, '正在恢复这局……');
    try {
      const data = await api('/api/session/' + want);
      sid = want;
      suspects.clear();
      for (const n of data.suspects || []) suspects.add(n);
      renderState(data);
      closePop('histPop');
    } catch (err) {
      dropHist(want);
      alert('这局打不开了：' + err.message + '（服务重启后对局不保留）');
    } finally {
      setLoading(false);
    }
  };
})();
renderHist();

// ── 难度文字链接：只改 #difficulty 的值（真源仍是服务端 DIFFICULTY_ROUNDS）─
document.querySelectorAll('.opts .d[data-diff]').forEach(d => {
  d.onclick = () => {
    $('difficulty').value = d.dataset.diff;
    document.querySelectorAll('.opts .d[data-diff]').forEach(x =>
      x.classList.toggle('on', x === d));
  };
});

// ── 试个例子：循环填入 ──────────────────────────────────────────────
const EXAMPLES = [
  '有人在公司群里说我把内部资料卖给了竞争对手，还说有人看到我跟对方一起吃饭',
  '同事都在传我升职是因为跟领导走得近，还说我周末被人看见一起出现在酒店',
  '小区群里有人发我照片说我就是那个偷外卖的，让我给大家一个说法',
  '有人在业主群里公开发帖，说我私吞了小区维修基金的回扣，还说他手里握有微信转账聊天记录',
];
let exIdx = 0;
if ($('exLink')) $('exLink').onclick = () => {
  $('event').value = EXAMPLES[exIdx % EXAMPLES.length];
  exIdx += 1;
};

// ── 立题结论：程序判的与裁判判的分开呈现（信息地图浮层里）───────────
function renderOpening(opening) {
  const o = opening || {};
  const judge = o.judge;
  let html = '';
  if (judge) {
    html += '<div class="jline">裁判立题：<b>' +
      esc(judge.worth_debating ? '值得辩' : '不值得辩') + '</b> · 材料' +
      esc(judge.sufficiency || '未评级') + '</div>';
    if (judge.note) html += '<div class="onote">' + esc(judge.note) + '</div>';
  } else {
    // 拿不到就如实说，不留空、更不显示"一切正常"。
    html += '<div class="jline">裁判<b>未给出</b>立题意见 —— 本局照常进行，但这一环没有把关。</div>';
  }
  for (const g of (judge && judge.gaps) || []) {
    html += '<div class="chk">裁判还缺：' + esc(g) + '</div>';
  }
  for (const c of o.checks || []) {
    html += '<div class="chk' + (c.level === 'block' ? ' block' : '') + '">' +
      esc(c.message) + '</div>';
  }
  return html;
}

// ── 三桶（信息地图浮层）：前端只展示不归类，口径不抄第二份 ──────────
function renderPartition(p) {
  const buckets = [
    ['shared', '公开战场', 's', '双方都知道'],
    ['theirs', '对方的牌', 't', '他声称有、你没见过'],
    ['mine', '你的底牌', 'm', '只有你知道（指控方看不到）'],
  ];
  let html = '';
  for (const [key, name, cls, sub] of buckets) {
    const items = (p && p[key]) || [];
    if (!items.length) continue;
    html += '<div class="gapline"><span class="k ' + cls + '">' + esc(name) + '</span>' +
      '<span class="v">' + esc(sub) + '：' +
      items.map(it => esc(it.fact) + (it.note ? '（' + esc(it.note) + '）' : '')).join('；') +
      '</span></div>';
  }
  return html;
}

function renderTurns(state) {
  const box = $('msgs');
  box.innerHTML = '';
  for (const t of state.turns) {
    const isPro = t.role === 'pro';
    const on = isPro && suspects.has(t.round);
    const el = document.createElement('div');
    el.className = 'msg ' + (isPro ? 'pro' : 'user');
    el.innerHTML = isPro
      ? '<span class="who">控</span>' +
        '<div class="mbody"><div class="txt">' + esc(t.text) + '</div>' +
        '<div class="markrow"><button class="mark' + (on ? ' on' : '') + '" data-round="' +
        t.round + '">' + (on ? '已标记可疑' : '⚑ 这句有问题') + '</button></div></div>'
      : '<div class="mbody"><div class="txt">' + esc(t.text) + '</div></div>';
    box.appendChild(el);
  }
  // 标记按钮：先自己判一次，揭示时再跟真相对照（带着判断听 vs 被动听）。
  box.querySelectorAll('button.mark').forEach(btn => {
    if (revealed) btn.disabled = true;
    btn.onclick = () => {
      if (revealed) return;
      const r = Number(btn.dataset.round);
      const on = !suspects.has(r);
      if (on) suspects.add(r); else suspects.delete(r);
      btn.classList.toggle('on', on);
      btn.textContent = on ? '已标记可疑' : '⚑ 这句有问题';
    };
  });
  box.scrollIntoView({behavior:'smooth', block:'end'});
}

function renderTrap(t) {
  return '<div class="trap">' +
    '<span class="k">' + esc(t.kind || '话术') + '</span>' +
    '<span class="ex">「' + esc(t.excerpt || '') + '」</span>' +
    '<div class="why">' + esc(t.why || '') + '</div></div>';
}
function renderTrapGroup(group) {
  const items = (group.traps || []).map(renderTrap).join('');
  if (!items) return '';
  return '<div class="meta">' + esc(group.layer) + '</div><div class="traps">' + items + '</div>';
}

function renderReveal(r) {
  // ⚠️ 分层由服务端给（r.trap_groups）——前端不自己按 kind 判层（口径不抄第二份）。
  const hasGroups = Array.isArray(r.trap_groups) && r.trap_groups.length > 0;
  const flat = (r.traps || []).length
    ? '<div class="traps">' + (r.traps || []).map(renderTrap).join('') + '</div>'
    : '';
  const traps = hasGroups ? r.trap_groups.map(renderTrapGroup).join('') : flat;
  const hot = (r.hot_spots || []).map(x => '<li>' + esc(x) + '</li>').join('');
  // solid_moves 与 hot_spots 成对：只报"你哪儿被带偏"，教出来的是被动。
  const solid = (r.solid_moves || []).map(x => '<li>' + esc(x) + '</li>').join('');
  const adv = (r.advice || []).map(x => '<li>' + esc(x) + '</li>').join('');
  // 当事人自己的判断 vs 真实话术（两个方向都报：抓对了，以及多疑了）。
  const sr = r.suspect_report || {};
  const markedN = (sr.marked || []).length;
  const hitN = (sr.hit || []).length;
  const faN = (sr.false_alarm || []).length;
  let suspectHtml;
  if (markedN) {
    const parts = ['你标记了 ' + markedN + ' 轮'];
    if (hitN) {
      parts.push('其中 ' + hitN + ' 轮对方确实用了话术（第 ' +
        (sr.hit || []).join('、') + ' 轮）');
    }
    if (faN) {
      parts.push('第 ' + (sr.false_alarm || []).join('、') +
        ' 轮其实没有话术 —— 那几轮是你多虑了');
    }
    suspectHtml =
      '<div class="meta">你自己标的，准不准</div>' +
      '<ul class="marked"><li>' + esc(parts.join('；')) + '</li></ul>';
  } else {
    suspectHtml =
      '<div class="hint" style="margin-top:14px">本局你没有标记任何一轮。' +
      '下次可以试试点「⚑ 这句有问题」先自己判一次，再看对不对得上。</div>';
  }
  // 裁判没交回结论时（judge_ok === false）服务端降级：提示顶到最上面。
  // 判据只认服务端给的 judge_ok，前端不自己推断"内容是不是空的"。
  const degraded = r.judge_ok === false;
  const summary = r.summary ? '<div class="banner">' + esc(r.summary) + '</div>' : '';

  // 信息差复盘（服务端纯函数算的数据：三桶对照 + 概念句固定文案）。
  const ig = r.info_gap_review;
  let gapHtml = '';
  if (ig) {
    const bucket = (title, items, note) =>
      '<div class="gapsec"><div class="bt">' + esc(title) + '</div>' +
      ((items || []).length
        ? '<ul>' + items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
        : '<div class="gnote">（这一桶受理时是空的）</div>') +
      '<div class="gnote">' + esc(note) + '</div></div>';
    gapHtml =
      '<div class="meta">' + esc(ig.title) + '</div>' +
      bucket('公开战场 · 双方都知道', ig.shared, ig.shared_note) +
      bucket('对方的牌 · 他声称有、你没见过', ig.theirs, ig.theirs_note) +
      bucket('你的底牌 · 只有你知道', ig.mine, ig.mine_note);
  }

  $('revealBox').innerHTML =
    '<h2>复盘 · 他刚才是这样编排你的</h2>' +
    (degraded ? summary.replace('class="banner"', 'class="banner top"') : '') +
    '<div class="hint">本局共交锋 ' + (r.rounds ?? 0) + ' 轮</div>' +
    traps +
    gapHtml +
    suspectHtml +
    (hot ? '<div class="meta" style="margin-top:14px">最容易带偏你的地方</div><ul class="plain">' + hot + '</ul>' : '') +
    (solid ? '<div class="meta">你这几句是站得住的</div><ul class="solid">' + solid + '</ul>' : '') +
    (adv ? '<div class="meta">下次怎么防</div><ul class="plain">' + adv + '</ul>' : '') +
    (degraded ? '' : summary) +
    // ⚠️ 教学伦理红线：本局必须以揭示收尾（揭示成功后立即调 /close）。
    '<div class="endrow"><button id="againBtn" class="textbtn">再体验一次</button>' +
    '<span class="hint">本局已结束：复盘即收尾。</span></div>';
  $('revealBox').classList.remove('hide');
  $('composer').classList.add('hide');
  // 揭示后标记按钮的失效由 renderState → renderTurns 统一处理（口径只有一处）。
  const again = $('againBtn');
  if (again) again.onclick = resetToIntro;
  $('revealBox').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderState(state) {
  if (state.case) {
    $('intro').classList.add('hide');
    $('chat').classList.remove('hide');
    // 命题/三桶/立题写进隐藏宿主（契约 id）+ 信息地图浮层。
    $('proposition').textContent = state.case.proposition || '（未给出命题）';
    $('partitionBox').innerHTML = renderPartition(state.case.partition);
    $('openingBox').innerHTML = renderOpening(state.opening);
    const mp = $('mapProp'); if (mp) mp.textContent = state.case.proposition || '（未给出命题）';
    const mb = $('mapBuckets'); if (mb) mb.innerHTML = $('partitionBox').innerHTML;
    const mo = $('mapOpening'); if (mo) mo.innerHTML = $('openingBox').innerHTML;
    $('headTitle').textContent = state.case.proposition || '对局进行中';
    $('headTitle').classList.remove('brand');
    // 顶栏右侧：进入对局后换成 轮数 + 信息地图。
    $('topRight').innerHTML =
      '<span id="roundHint"></span>' +
      '<a class="lnk" id="mapLink">信息地图</a>';
    if ($('mapLink')) $('mapLink').onclick = () => openPop('mapPop');
  }
  // 相位渲染：awaiting_details 时出追问卡、收输入框（此时辩白会被 409 拒）。
  const awaiting = state.phase === 'awaiting_details';
  $('detailsBox').classList.toggle('hide', !awaiting);
  if (awaiting) $('followupText').textContent = state.followup || '';
  if (state.case && !state.reveal) {
    $('composer').classList.toggle('hide', awaiting);
  }
  // 必须在 renderTurns 之前定好（揭示后那帧要把标记按钮一起禁用）。
  revealed = !!state.reveal;
  renderTurns(state);
  const used = state.pro_rounds || 0;
  const max = state.max_rounds || 5;
  // roundHint 可能刚被重建（首帧），取新的那个。
  const rh = document.getElementById('roundHint');
  if (rh) rh.textContent = used + ' / ' + max + ' 轮';
  atCap = used >= max;
  if (state.notice && rh) rh.textContent = state.notice;
  if (state.reveal) renderReveal(state.reveal);
}

// ── 会话收尾（教学伦理红线：揭示即收尾，前端立即调 /close）──────────
async function closeSession() {
  if (!sid) return;
  const closing = sid;
  sid = null;
  try {
    await api('/api/session/' + closing + '/close', {method: 'POST'});
  } catch (e) {
    console.warn('结束会话失败：', e);
  }
}

function resetToIntro() {
  sid = null;
  atCap = false;
  suspects.clear();
  revealed = false;
  $('revealBox').classList.add('hide');
  $('revealBox').innerHTML = '';
  $('chat').classList.add('hide');
  $('intro').classList.remove('hide');
  // ⚠️ composer 的 hide 必须撤掉（旧页教训：不撤=第二局输入框永久消失）。
  $('composer').classList.remove('hide');
  $('msgs').innerHTML = '';
  $('reply').value = '';
  $('details').value = '';
  $('event').value = '';
  $('headTitle').textContent = '反诈演练场';
  $('headTitle').classList.add('brand');
  $('topRight').innerHTML =
    '<a class="lnk" id="histLink">历史</a><a class="lnk" id="keyLink">口令</a>';
  if ($('histLink')) $('histLink').onclick = () => { renderHist(); openPop('histPop'); };
  if ($('keyLink')) $('keyLink').onclick = () => openPop('keyPop');
  renderHist();
  closePop('histPop'); closePop('keyPop'); closePop('mapPop');
  $('event').focus();
}

$('startBtn').onclick = async () => {
  const event = $('event').value.trim();
  if (!event) { $('event').focus(); return; }
  $('startBtn').disabled = true;
  setLoading(true, '受理官正在受理，裁判正在立题……');
  try {
    const data = await api('/api/session', {
      method: 'POST',
      body: {event, difficulty: $('difficulty').value}
    });
    sid = data.session_id;
    pushHist(sid, (data.case && data.case.proposition) || event);
    renderState(data);
  } catch (e) {
    alert('开局失败：' + e.message);
  } finally {
    setLoading(false);
    $('startBtn').disabled = false;
  }
};

$('sendBtn').onclick = async () => {
  const text = $('reply').value.trim();
  if (!text || !sid) return;
  $('reply').value = '';
  $('sendBtn').disabled = true;
  setLoading(true, '指控方正在组织回应……');
  try {
    renderState(await api('/api/session/' + sid + '/reply', {method: 'POST', body: {text}}));
  } catch (e) {
    alert('发送失败：' + e.message);
  } finally {
    setLoading(false);
    $('sendBtn').disabled = atCap;  // 触顶后不要再放开
  }
};

$('revealBtn').onclick = async () => {
  if (!sid) return;
  $('revealBtn').disabled = true;
  setLoading(true, '裁判正在逐条梳理话术……');
  try {
    // ⚠️ 必须显式 POST（旧页教训：一个字符的差别曾让揭示整体 405）。
    renderState(await api('/api/session/' + sid + '/reveal', {
      method: 'POST',
      body: {suspected: [...suspects]}
    }));
    // 红线：揭示即收尾。
    await closeSession();
  } catch (e) {
    alert('揭示失败：' + e.message);
  } finally {
    setLoading(false);
    if (sid) $('revealBtn').disabled = false;
  }
};

$('reply').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('sendBtn').click(); }
});

// ── 受理官澄清问题：回答 / 跳过（追问是可选的）──────────────────────
// 与 reply 不同：空文本 = 合法的跳过，所以不能复用"空就不发"的逻辑。
async function submitDetails(skip) {
  if (!sid) return;
  const text = skip ? '' : $('details').value.trim();
  $('detailsBtn').disabled = true;
  $('skipBtn').disabled = true;
  setLoading(true, skip ? '受理完成，正在开辩……' : '受理官正在更新信息分区……');
  try {
    renderState(await api('/api/session/' + sid + '/details', {
      method: 'POST',
      body: {text}
    }));
  } catch (e) {
    alert('提交失败：' + e.message);
  } finally {
    setLoading(false);
    $('details').value = '';
    $('detailsBtn').disabled = false;
    $('skipBtn').disabled = false;
  }
}

$('detailsBtn').onclick = () => submitDetails(false);
$('skipBtn').onclick = () => submitDetails(true);
$('details').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('detailsBtn').click();
});
</script>
